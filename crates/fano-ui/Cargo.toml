[package]
name = "fano-ui"
description = "L'interface de Fanoratana (egui), la même sur Linux et sur Android."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fano-core = { workspace = true }
fano-ink = { workspace = true }
fano-reco = { workspace = true }
fano-render = { workspace = true }
fano-maj = { path = "../fano-maj" }
egui = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
usvg = { workspace = true }
tiny-skia = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
tempfile = "3"
